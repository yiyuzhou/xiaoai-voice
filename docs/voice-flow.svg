<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-labelledby="title description">
  <title id="title">小爱与豆包的双唤醒流程</title>
  <desc id="description">麦克风把声音同时交给两个唤醒模块。小爱直接回应，豆包由火山引擎返回语音。小爱唤醒时，豆包停止播放并退出会话。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#526680"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="332" rx="18" fill="#f8fafc" stroke="#d9e2eb"/>
  <g fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)">
    <path d="M380 62V82H215V101"/>
    <path d="M380 62V82H545V101"/>
    <path d="M215 151V269H277"/>
    <path d="M545 151V179"/>
    <path d="M545 229V269H483"/>
  </g>
  <g stroke-width="1">
    <rect x="280" y="20" width="200" height="42" rx="9" fill="#ffffff" stroke="#bac8d8"/>
    <rect x="75" y="103" width="280" height="48" rx="9" fill="#edf4ff" stroke="#a6bee2"/>
    <rect x="405" y="103" width="280" height="48" rx="9" fill="#e9f7f2" stroke="#a4cebe"/>
    <rect x="405" y="181" width="280" height="48" rx="9" fill="#e9f7f2" stroke="#a4cebe"/>
    <rect x="280" y="248" width="200" height="42" rx="9" fill="#ffffff" stroke="#bac8d8"/>
  </g>
  <g fill="#172b46" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle" dominant-baseline="central" font-size="17">
    <text x="380" y="41">音箱麦克风</text>
    <text x="215" y="127">小爱同学 · 原厂小爱回应</text>
    <text x="545" y="127">豆包豆包 · 音箱本地识别</text>
    <text x="545" y="205">火山引擎 · 实时语音对话</text>
    <text x="380" y="269">音箱扬声器</text>
    <text x="380" y="312" font-size="15" fill="#405772">小爱唤醒时，豆包停止播放并退出会话</text>
  </g>
</svg>
